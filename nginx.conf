server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Atrás do proxy do Coolify o host e a porta públicos não são estes: redirecionar só pelo caminho.
    absolute_redirect off;

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/ld+json application/manifest+json image/svg+xml text/plain application/xml text/xml;

    include /etc/nginx/conf.d/security-headers.inc;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Arquivos do Vite têm hash no nome: podem ficar em cache por um ano.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Ícones, imagens de compartilhamento e manifesto: nomes fixos, então cache mais curto.
    location ~* \.(png|jpg|jpeg|webp|ico|svg|webmanifest)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Páginas: cada endereço é uma pasta com index.html (o nginx redireciona /privacidade para /privacidade/).
    # Endereço que não existe devolve 404 de verdade, não a página inicial (evita "soft 404" no Google).
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
